name: Merge Policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - develop

jobs:
  validate-source-branch:
    name: validate-source-branch
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch naming
        run: |
          SOURCE="${{ github.head_ref }}"
          TARGET="${{ github.base_ref }}"

          echo "Origem:  $SOURCE"
          echo "Destino: $TARGET"

          if [ "$TARGET" = "main" ]; then
            if [[ ! "$SOURCE" =~ ^(release|hotfix)/ ]]; then
              echo "❌ ERRO: PRs para 'main' devem vir de 'release/*' ou 'hotfix/*'"
              echo "   Origem recebida: $SOURCE"
              exit 1
            fi
          fi

          if [ "$TARGET" = "develop" ]; then
            if [[ ! "$SOURCE" =~ ^(feature|bugfix|chore|docs|release|hotfix)/ ]]; then
              echo "❌ ERRO: PRs para 'develop' devem vir de feature/*, bugfix/*, chore/*, docs/*, release/* ou hotfix/*"
              echo "   Origem recebida: $SOURCE"
              exit 1
            fi
          fi

          echo "✅ Origem válida para destino $TARGET"
