<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | AI Quality Engineering</title>
    <link rel="stylesheet" href="/css/base.css" />
  </head>
  <body>
    <main class="form-card">
      <h1>Login</h1>
      <form data-testid="login-form">
        <label for="email">E-mail</label>
        <input data-testid="login-email" id="email" name="email" required type="email" />
        <label for="password">Senha</label>
        <input
          data-testid="login-password"
          id="password"
          name="password"
          required
          type="password"
        />
        <button data-testid="login-submit" type="submit" class="btn-primary">Entrar</button>
      </form>
      <p data-testid="login-message" role="status" aria-live="polite" class="message"></p>
      <p class="form-links">
        <a data-testid="login-forgot-link" href="/forgot-password">Esqueci minha senha</a>
      </p>
      <p class="form-links">
        <a data-testid="login-users-link" href="/users">Ver usuários cadastrados</a>
      </p>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
