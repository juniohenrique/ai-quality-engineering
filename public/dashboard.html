<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard | AI Quality Engineering</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
  </head>
  <body>
    <main class="page-container">
      <header class="page-header">
        <h1>Dashboard</h1>
        <a class="btn-secondary" href="/users.html">Usuários</a>
      </header>

      <p class="message" data-testid="dashboard-message" role="status" aria-live="polite"></p>

      <section class="stat-grid">
        <article class="stat-card">
          <h2 class="stat-card__title">Usuários</h2>
          <p class="stat-card__value" data-testid="dashboard-users-total">—</p>
          <dl class="stat-card__breakdown">
            <dt>Admin</dt><dd data-testid="dashboard-users-admin">—</dd>
            <dt>User</dt><dd data-testid="dashboard-users-user">—</dd>
          </dl>
        </article>

        <article class="stat-card">
          <h2 class="stat-card__title">Pagamentos</h2>
          <p class="stat-card__value" data-testid="dashboard-payments-total">—</p>
          <dl class="stat-card__breakdown" data-testid="dashboard-payments-by-status">
            <!-- preenchido via JS -->
          </dl>
        </article>
      </section>

      <h2 class="section-title">Últimas transações</h2>
      <div class="table-card">
        <table class="recent-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Valor</th>
              <th>Status</th>
              <th>Criado em</th>
            </tr>
          </thead>
          <tbody data-testid="dashboard-recent-list"></tbody>
        </table>
      </div>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
