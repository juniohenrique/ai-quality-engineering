<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Usuários | AI Quality Engineering</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/users.css" />
  </head>
  <body>
    <main class="page-container">
      <header class="page-header">
        <h1>Usuários</h1>
        <a class="btn-primary" data-testid="user-create-button" href="/user-form.html"
          >Criar usuário</a
        >
      </header>
      <p class="message" data-testid="user-message" role="status" aria-live="polite"></p>
      <div class="table-card">
        <table class="users-table">
          <thead>
            <tr>
              <th>Nome</th>
              <th>E-mail</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody data-testid="user-list"></tbody>
        </table>
      </div>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
