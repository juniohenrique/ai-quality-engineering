<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Usuário | AI Quality Engineering</title>
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/user-form.css" />
  </head>
  <body>
    <main>
      <h1>Novo usuário</h1>
      <div class="form-card">
        <form data-testid="user-form">
          <fieldset>
            <legend>Informações do usuário</legend>

            <div class="form-group">
              <label for="user-name">Nome</label>
              <input
                data-testid="user-name"
                id="user-name"
                name="name"
                type="text"
                autocomplete="name"
                required
                minlength="2"
                aria-describedby="user-name-error"
              />
              <span class="error" id="user-name-error" role="alert" aria-live="polite"></span>
            </div>

            <div class="form-group">
              <label for="user-email">E-mail</label>
              <input
                data-testid="user-email"
                id="user-email"
                name="email"
                type="email"
                autocomplete="email"
                required
                aria-describedby="user-email-error"
              />
              <span class="error" id="user-email-error" role="alert" aria-live="polite"></span>
            </div>

            <div class="form-actions">
              <button class="btn-primary" data-testid="user-save" type="submit" aria-busy="false">
                Salvar
              </button>
              <a
                class="btn-secondary"
                data-testid="user-cancel"
                href="/users"
                role="button"
                aria-label="Cancelar edição"
                >Cancelar</a
              >
            </div>
          </fieldset>
        </form>

        <div class="message" data-testid="user-message" role="status" aria-live="polite"></div>
      </div>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
