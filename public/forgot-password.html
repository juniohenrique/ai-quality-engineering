<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recuperar senha | AI Quality Engineering</title>
    <link rel="stylesheet" href="/css/base.css" />
  </head>
  <body>
    <main class="form-card">
      <h1>Recuperar senha</h1>
      <p class="form-intro">
        Informe seu e-mail. Se houver uma conta associada, enviaremos
        um link para redefinir sua senha.
      </p>
      <form data-testid="forgot-form">
        <label for="email">E-mail</label>
        <input
          data-testid="forgot-email"
          id="email"
          name="email"
          required
          type="email"
          autocomplete="email"
        />
        <button data-testid="forgot-submit" type="submit" class="btn-primary">
          Enviar link
        </button>
      </form>
      <p
        data-testid="forgot-message"
        role="status"
        aria-live="polite"
        class="message"
      ></p>
      <p class="form-links">
        <a data-testid="forgot-back-link" href="/login.html">Voltar para o login</a>
      </p>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
