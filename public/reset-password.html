<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redefinir senha | AI Quality Engineering</title>
    <link rel="stylesheet" href="/css/base.css" />
  </head>
  <body>
    <main class="form-card">
      <h1>Redefinir senha</h1>
      <p class="form-intro">Escolha uma nova senha (mínimo 8 caracteres).</p>
      <form data-testid="reset-form">
        <label for="newPassword">Nova senha</label>
        <input
          data-testid="reset-newPassword"
          id="newPassword"
          name="newPassword"
          required
          type="password"
          minlength="8"
          autocomplete="new-password"
        />
        <label for="confirmPassword">Confirme a nova senha</label>
        <input
          data-testid="reset-confirmPassword"
          id="confirmPassword"
          name="confirmPassword"
          required
          type="password"
          minlength="8"
          autocomplete="new-password"
        />
        <button data-testid="reset-submit" type="submit" class="btn-primary">
          Redefinir senha
        </button>
      </form>
      <p
        data-testid="reset-message"
        role="status"
        aria-live="polite"
        class="message"
      ></p>
      <p class="form-links">
        <a data-testid="reset-back-link" href="/login.html">Voltar para o login</a>
      </p>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
